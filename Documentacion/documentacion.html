<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Documentación · ALMA / XDR · VOX DEI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--pn:#0d1424;--p2:#111b2f;--ln:#1c2a42;--tx:#eaf1fb;--mu:#93a6bf;--bl:#2563eb;--ct:#6ea8ff;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}h1,h2,h3,p{margin:0}:focus-visible{outline:2px solid var(--ct);outline-offset:2px}
header{position:sticky;top:0;z-index:40;height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;background:rgba(13,20,36,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:12px}.brand img{height:38px;width:auto}.brand b{display:block;font-size:14px;line-height:1.3}.brand small{color:var(--mu);font-size:12px}
.sp{margin-left:auto;display:flex;align-items:center;gap:16px}.sr{position:relative}
.sr input{width:290px;max-width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:99px;padding:8px 14px 8px 36px;color:var(--tx);font:13px Inter,system-ui,sans-serif}.sr input:focus{outline:0;border-color:var(--bl)}
.sr svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mu);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.bk{font-size:13px;color:var(--mu);white-space:nowrap}.bk:hover{color:var(--tx)}
.ib{display:none;width:40px;height:40px;border:1px solid var(--ln);border-radius:10px;background:none;color:var(--tx);cursor:pointer;font-size:18px;align-items:center;justify-content:center}
.lay{flex:1;display:flex;position:relative}
aside{position:sticky;top:64px;align-self:flex-start;width:320px;flex:none;height:calc(100vh - 64px);overflow-y:auto;padding:20px;border-right:1px solid var(--ln);background:rgba(13,20,36,.55)}
main{flex:1;min-width:0;max-width:1040px;margin:0 auto;padding:40px 32px 80px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font:500 12px Inter,system-ui,sans-serif;padding:5px 12px;border-radius:99px;border:1px solid var(--ln);background:none;color:var(--mu);cursor:pointer;transition:border-color .2s,color .2s}.chip:hover{border-color:var(--ct);color:var(--tx)}.chip[aria-pressed=true]{background:var(--bl);border-color:var(--bl);color:#fff}
.cl{font:500 11px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:16px 0 8px}
details{margin-top:12px}summary{cursor:pointer;list-style:none;font:600 11.5px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);padding:6px 4px;display:flex;justify-content:space-between}summary::-webkit-details-marker{display:none}summary::after{content:"▾";transition:transform .2s}details:not([open]) summary::after{transform:rotate(-90deg)}
.nl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13.5px;color:#c9d6ea}.nl:hover{background:var(--p2)}.nl[aria-current=page]{background:rgba(37,99,235,.2);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--mu)}.dot.ok{background:#3ddc97}.dot.wn{background:#ffc15e}.dot.bl{background:#6ea8ff}
.b{display:inline-flex;font:500 11px "JetBrains Mono",ui-monospace,monospace;padding:3px 10px;border-radius:99px;border:1px solid}
.b.ok{color:#3ddc97;background:rgba(61,220,151,.1);border-color:rgba(61,220,151,.3)}.b.wn{color:#ffc15e;background:rgba(255,193,94,.1);border-color:rgba(255,193,94,.3)}.b.bl{color:#6ea8ff;background:rgba(110,168,255,.1);border-color:rgba(110,168,255,.3)}.b.mu{color:var(--mu);background:rgba(147,166,191,.08);border-color:rgba(147,166,191,.28)}
h1{font-size:clamp(30px,4vw,44px);letter-spacing:-.03em;line-height:1.1;font-weight:800;text-shadow:2px 6px 28px rgba(59,130,246,.4)}
.lead{color:var(--mu);margin-top:14px;max-width:46em;font-size:16px}
.nt{margin:24px 0 4px;padding:12px 16px;border:1px solid rgba(110,168,255,.3);background:rgba(37,99,235,.08);border-radius:12px;font-size:13.5px;color:#c9d6ea}
.fh{display:flex;align-items:center;gap:10px;margin:34px 0 12px;font:600 12px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}.fh::after{content:"";flex:1;height:1px;background:var(--ln)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.cd{display:block;padding:18px;border:1px solid var(--ln);border-radius:16px;background:var(--pn);transition:transform .3s,border-color .3s}.cd:hover{transform:translateY(-4px);border-color:rgba(110,168,255,.6)}
.cd .t{display:flex;justify-content:space-between;align-items:center}.cd .ar{color:var(--mu);transition:transform .25s,color .25s}.cd:hover .ar{transform:translateX(4px);color:var(--ct)}
.cd h3{font-size:15px;margin:12px 0 6px}.cd p{font-size:13px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.crumb{font:12px "JetBrains Mono",ui-monospace,monospace;color:var(--mu);margin-bottom:14px}.crumb a:hover{color:var(--tx)}
.ah{padding-bottom:22px;border-bottom:1px solid var(--ln);margin-bottom:26px}.ah h1{margin:14px 0 10px}.ah p{color:#c9d6ea}.tags{display:flex;flex-wrap:wrap;gap:8px}
.co{padding:14px 18px;border-radius:12px;border:1px solid;font-size:14px;margin-bottom:22px;color:#e6ecf8}.co.wn{border-color:rgba(255,193,94,.35);background:rgba(255,193,94,.08)}.co.bl{border-color:rgba(110,168,255,.35);background:rgba(37,99,235,.1)}.co.mu{border-color:var(--ln);background:var(--pn)}
.sec{border:1px solid var(--ln);border-radius:16px;background:var(--pn);margin-bottom:16px;overflow:hidden}
.sec h3{font-size:14px;padding:14px 20px;background:var(--p2);border-bottom:1px solid var(--ln)}.sec .bd{padding:18px 20px;font-size:14px;color:#c9d6ea}.sec .bd>*+*{margin-top:12px}
.sec ul,.es{padding-left:20px;margin:0}.sec li{margin:6px 0}.es li{margin:8px 0;color:#c9d6ea}.sec code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px;color:#9fc3ff}.sec strong{color:#fff}
.code{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:#050912}.code-h{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--ln);font:12px "JetBrains Mono",ui-monospace,monospace;color:var(--mu)}
.copy{font:12px Inter,system-ui,sans-serif;color:var(--mu);background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:3px 10px;cursor:pointer}.copy:hover{color:#fff;border-color:var(--ct)}
.code pre{margin:0;padding:14px;overflow-x:auto;font:12.5px/1.7 "JetBrains Mono",ui-monospace,monospace;color:#9fc3ff}.code pre code{color:inherit}
.cmd{padding:12px 14px;border:1px solid var(--ln);border-radius:10px;background:#050912;font:12.5px "JetBrains Mono",ui-monospace,monospace;color:#9fc3ff;overflow-x:auto}
.pd{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pc{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid rgba(110,168,255,.35);border-radius:16px;background:linear-gradient(160deg,rgba(37,99,235,.14),var(--pn))}.pc h3{font-size:15px}.pc p{font-size:13px;color:var(--mu)}
.pb{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}.bt{display:inline-flex;align-items:center;gap:6px;font:600 12.5px Inter,system-ui,sans-serif;padding:7px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);transition:border-color .2s}.bt:hover{border-color:var(--ct)}.bt.pr{background:var(--bl);border-color:var(--bl);color:#fff}
.pr2{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 22px;padding:12px 16px;border:1px solid var(--ln);border-radius:12px;background:var(--pn);font-size:13px;color:#c9d6ea}
.fg{margin:14px 0 0}.fg img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--ln);transition:border-color .2s}.fg a:hover img{border-color:var(--ct)}.fg figcaption{font-size:12px;color:var(--mu);margin-top:6px}
.back{display:inline-flex;margin-top:22px;font-size:13px;color:var(--ct)}.back:hover{text-decoration:underline}
.fade{animation:f .35s both}@keyframes f{from{opacity:0;transform:translateY(8px)}}
#toast{position:fixed;right:20px;bottom:20px;z-index:60;padding:10px 16px;border:1px solid rgba(110,168,255,.4);background:var(--pn);border-radius:12px;font-size:13px;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}#toast.on{opacity:1;transform:none}
#bd{display:none;position:fixed;inset:64px 0 0;background:rgba(0,0,0,.6);z-index:25}
@media(max-width:1023px){.ib{display:inline-flex}aside{position:fixed;top:64px;left:0;bottom:0;height:auto;z-index:30;transform:translateX(-100%);transition:transform .3s;background:var(--pn);width:min(320px,88vw)}aside.op{transform:none}#bd.op{display:block}main{padding:28px 18px 70px}.brand small,.bk{display:none}.sr input{width:160px}}
@media(max-width:560px){.brand b{display:none}.sr input{width:130px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>

<div class="sp"><label class="sr"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Buscar manuales, comandos…" aria-label="Buscar en la documentación" autocomplete="off"></label><a class="bk" id="site" href="#">← Volver al sitio</a></div></header>
<div class="lay"><aside id="sb" aria-label="Índice de manuales"><div id="tree"></div></aside><div id="bd"></div><main id="main" tabindex="-1"></main></div>
<div id="toast" role="status"></div>
<script src="manuales.js"></script>
<script>
const D=window.ALMA_DOCS,$=i=>document.getElementById(i),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
$('site').href=D.SITIO||'#';
const EST={disponible:['Disponible','ok'],borrador:['Borrador','wn'],elaboracion:['En elaboración','bl'],planeado:['Planeado','mu']};
const AUD={preventa:'Para evaluar',cliente:'Para operar'};
const st={aud:'todos',fase:'todas',q:''};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const plain=h=>h.replace(/<[^>]+>/g,' ');
const hay=m=>m._h||(m._h=(m.titulo+' '+m.desc+' '+(m.secciones||[]).map(s=>s.titulo+' '+plain(s.contenido)).join(' ')+' '+(m.esquema||[]).join(' ')).toLowerCase());
const ok=m=>(st.aud=='todos'||m.aud.includes(st.aud))&&(st.fase=='todas'||m.fase==st.fase)&&(!st.q||hay(m).includes(st.q));
const B=(t,c)=>`<span class="b ${c}">${t}</span>`,eb=m=>B(EST[m.estado][0],EST[m.estado][1]);
const chip=(k,v,l)=>`<button class="chip" data-k="${k}" data-v="${v}" aria-pressed="${st[k]==v}">${l}</button>`;
function tree(){const cur=location.hash.slice(1);
let h=`<div class="cl">Para quién</div><div class="chips">${[['todos','Todos'],['preventa','Para evaluar'],['cliente','Para operar']].map(a=>chip('aud',...a)).join('')}</div><div class="cl">Fase</div><div class="chips">${[{id:'todas',nombre:'Todas'},...D.fases].map(f=>chip('fase',f.id,f.nombre)).join('')}</div>`;
let n=0;D.categorias.forEach(c=>{const ms=D.manuales.filter(m=>m.cat==c.id&&ok(m));if(!ms.length)return;n+=ms.length;
h+=`<details open><summary>${c.nombre}</summary>${ms.map(m=>`<a class="nl" href="#${m.id}"${m.id==cur?' aria-current="page"':''}><span class="dot ${EST[m.estado][1]}"></span><span>${m.titulo}</span></a>`).join('')}</details>`});
if(!n)h+='<p class="lead" style="font-size:13px">Sin resultados con estos filtros.</p>';$('tree').innerHTML=h}
const card=m=>`<a class="cd" href="#${m.id}"><div class="t">${eb(m)}<span class="ar" aria-hidden="true">→</span></div><h3>${m.titulo}</h3><p>${m.desc}</p></a>`;
const pdfBtns=k=>{const p=D.pdfs&&D.pdfs[k];return p?`<a class="bt pr" href="${p.archivo}" target="_blank" rel="noopener">Ver PDF</a><a class="bt" href="${p.archivo}" download>Descargar</a>`:''};
const pdfCard=k=>{const p=D.pdfs[k];return `<div class="pc"><div class="t">${B(p.info,'bl')}</div><h3>${p.titulo}</h3><p>${p.desc}</p><div class="pb">${pdfBtns(k)}</div></div>`};
function home(){const ms=D.manuales.filter(ok);
let h=`<div class="fade"><h1>Manuales a la vista</h1><p class="lead">Encuentra la guía que necesitas por módulo (menú lateral) o por fase de uso: empezar, instalar, configurar, operar, solucionar problemas y consultar referencia. Los labs son prácticas guiadas.</p><div class="nt">Proyecto académico de VOX DEI × UTVT. Los valores entre &lt; &gt; y los nombres de host son ejemplos: reemplázalos por los de tu despliegue.</div>`;
if(D.pdfs&&!st.q&&st.fase=='todas')h+=`<div class="fh">Manuales en PDF</div><div class="pd">${Object.keys(D.pdfs).map(pdfCard).join('')}</div>`;
D.fases.forEach(f=>{const l=ms.filter(m=>m.fase==f.id);if(l.length)h+=`<div class="fh">${f.nombre}</div><div class="gr">${l.map(card).join('')}</div>`});
if(!ms.length)h+='<p class="lead">No hay manuales que coincidan. Prueba con otra búsqueda o quita filtros.</p>';
$('main').innerHTML=h+'</div>'}
function art(m){const c=D.categorias.find(x=>x.id==m.cat),f=D.fases.find(x=>x.id==m.fase);
const msg={planeado:['mu','Este manual está planeado y todavía no se ha redactado. Abajo se muestra el contenido previsto.'],elaboracion:['bl','Este manual está en elaboración. Abajo se muestra el contenido previsto.'],borrador:['wn','Borrador: el contenido está pendiente de revisión técnica.'],disponible:null}[m.estado];
let h=`<div class="fade"><div class="crumb"><a href="#">Documentación</a> › ${c.nombre}</div><div class="ah"><div class="tags">${eb(m)}${B(f.nombre,'bl')}${m.aud.map(a=>B(AUD[a],'mu')).join('')}</div><h1>${m.titulo}</h1><p>${m.desc}</p></div>`;
if(m.pdf&&D.pdfs&&D.pdfs[m.pdf])h+=`<div class="pr2"><span>Este tema también está en el <strong>${D.pdfs[m.pdf].titulo}</strong>.</span>${pdfBtns(m.pdf)}</div>`;
if(msg)h+=`<div class="co ${msg[0]}">${msg[1]}</div>`;
if(m.esquema)h+=`<div class="sec"><h3>Contenido previsto</h3><div class="bd"><ul class="es">${m.esquema.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div></div>`;
(m.secciones||[]).forEach(s=>h+=`<div class="sec"><h3>${s.titulo}</h3><div class="bd">${s.contenido}</div></div>`);
$('main').innerHTML=h+`<a class="back" href="#">← Todos los manuales</a></div>`}
function route(){const m=D.manuales.find(x=>x.id==location.hash.slice(1));m?art(m):home();tree();scrollTo({top:0,behavior:RM?'auto':'smooth'});side(false)}
function side(o){$('sb').classList.toggle('op',o);$('bd').classList.toggle('op',o);$('mb').setAttribute('aria-expanded',o);$('mb').textContent=o?'×':'☰'}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function copyCodeSnippet(b){const t=b.parentElement.nextElementSibling.innerText;const f=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('Fragmento copiado')}catch(e){toast('No se pudo copiar')}x.remove()};
navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(t).then(()=>toast('Fragmento copiado'),f):f()}
$('tree').onclick=e=>{const b=e.target.closest('.chip');if(b){st[b.dataset.k]=b.dataset.v;route()}else if(e.target.closest('.nl'))side(false)};
$('q').oninput=e=>{st.q=e.target.value.toLowerCase().trim();if(location.hash.length>1)location.hash='';else route()};
